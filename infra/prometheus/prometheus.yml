global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'node'                # metricas del host/servidor (CPU, RAM, red)
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'securedev-app'       # metricas de seguridad de la aplicacion
    static_configs:
      - targets: ['securedev-app:9102']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
