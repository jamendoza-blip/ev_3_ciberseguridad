# Plataforma DevSecOps: Jenkins (CI/CD) + Prometheus + Grafana (monitoreo)
# La aplicacion la despliega el pipeline en la red ev3_net (contenedor securedev-app)
name: ev3

services:
  jenkins:
    build: ./infra/jenkins
    container_name: ev3-jenkins
    user: root                       # necesario para usar /var/run/docker.sock en Docker Desktop (solo laboratorio)
    env_file: .env
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/repo:ro                  # repositorio git local que Jenkins vigila (pollSCM)
    networks: [ev3_net]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.0
    container_name: ev3-node-exporter
    networks: [ev3_net]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ev3-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks: [ev3_net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: ev3-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks: [ev3_net]
    restart: unless-stopped

networks:
  ev3_net:
    name: ev3_net

volumes:
  jenkins_home:
  grafana_data:
